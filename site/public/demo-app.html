<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>SeatMark — Checkout</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{font:15px/1.6 -apple-system,"Segoe UI","Helvetica Neue",sans-serif;background:#f4f3ef;color:#1c1d21;min-height:100vh}
  .nav{display:flex;align-items:baseline;gap:26px;padding:20px 40px;background:#fff;border-bottom:1px solid #e7e5de}
  .nav b{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .nav span{font-size:13.5px;color:#7a7a80}
  .nav .cart{margin-left:auto;font:600 12px ui-monospace,monospace;background:#efede6;border-radius:7px;padding:5px 12px}
  main{max-width:560px;margin:44px auto;padding:0 24px}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  .sub{color:#7a7a80;font-size:13.5px;margin-bottom:26px}
  .card{background:#fff;border:1px solid #e7e5de;border-radius:14px;padding:20px 22px;margin-bottom:16px}
  .ev{display:flex;gap:14px;align-items:center;padding-bottom:16px;border-bottom:1px dashed #e7e5de}
  .thumb{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,#1c1d21 25%,#41507a);position:relative;flex:none}
  .thumb::after{content:"";position:absolute;inset:16px;border-radius:50%;background:#e5484d}
  .ev b{font-size:14.5px}
  .ev p{font-size:12px;color:#7a7a80;margin-top:3px}
  .ev em{margin-left:auto;font:600 15px ui-monospace,monospace;font-style:normal}
  .row{display:flex;justify-content:space-between;padding-top:12px;font-size:13px;color:#7a7a80}
  .row.tot{font-size:15px;font-weight:700;color:#1c1d21}
  .row.tot span:last-child{font-family:ui-monospace,monospace}
  .coupon{display:flex;gap:10px;margin-bottom:16px}
  .coupon input{flex:1;border:1px solid #e7e5de;border-radius:9px;padding:11px 14px;font:13.5px inherit;background:#fff}
  .coupon button{border:1px solid #d8d6cc;background:#fff;border-radius:9px;padding:0 18px;font:600 13px inherit;cursor:pointer}
  .pay{width:100%;background:#1c1d21;color:#f4f3ef;border:0;border-radius:11px;padding:15px;font:600 15px inherit;cursor:pointer;letter-spacing:.01em}
  .hint{text-align:center;font-size:11px;color:#a5a5aa;margin-top:14px;font-family:ui-monospace,monospace}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1c1d21;color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;opacity:0;transition:opacity .3s}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="nav"><b>SeatMark</b><span>Events</span><span>Venues</span><span>Help</span><span class="cart">Cart · 2</span></div>
<main>
  <h1>Checkout</h1>
  <p class="sub">Order #SM-2024-1187 · hold expires in 10:00</p>
  <div class="card">
    <div class="ev"><div class="thumb"></div><div><b>Coldplay · Music of the Spheres</b><p>Sat 19:30 · National Stadium · B2 Row 14 · ×2</p></div><em>¥2,560</em></div>
    <div class="row"><span>Service fee</span><span>¥120</span></div>
    <div class="row"><span>Insurance</span><span>¥40</span></div>
    <div class="row tot"><span>Total</span><span>¥2,720</span></div>
  </div>
  <div class="coupon"><input placeholder="Promo code"><button id="apply">Apply</button></div>
  <button class="pay" id="pay">Pay ¥2,720</button>
  <p class="hint">Secured checkout · UnionPay · Alipay · WeChat Pay</p>
</main>
<div class="toast" id="toast"></div>
<script>
  // intentionally buggy: #pay is dead (the thing the session catches);
  // #apply works but its endpoint 404s.
  document.getElementById("apply").onclick = () => {
    fetch("/api/coupon", {method:"POST",body:"{}"}).catch(()=>{});
    const t = document.getElementById("toast");
    t.textContent = "Invalid promo code"; t.classList.add("on");
    setTimeout(()=>t.classList.remove("on"),1800);
  };
</script>
</body>
</html>
