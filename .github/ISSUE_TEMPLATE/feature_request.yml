name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Witness doesn't support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Sketch is fine — "it should just work" is also acceptable.
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Does this involve sending data off-device?
      options: ["No — stays local", "Optional cloud provider", "Unclear"]
    validations:
      required: true
